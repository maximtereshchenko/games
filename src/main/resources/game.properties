screens.title.text=SNAKES\n\
Press any key to continue
screens.main.buttons.statistics.name=Statistics
screens.main.buttons.statistics.description=Check out all your game statistics in here.
screens.main.buttons.credits.name=Credits
screens.main.buttons.credits.description=This is the credits screen.
screens.main.buttons.settings.name=Settings
screens.main.buttons.settings.description=This is the settings screen.
screens.main.buttons.modes.classic.name=Classic
screens.main.buttons.modes.classic.description=This is the basic snake game.
screens.main.buttons.modes.viper.name=Viper
screens.main.buttons.modes.viper.description=Vipers are the Derek Zoolanders of the snake kingdom.
screens.main.buttons.modes.viper.unlock.requirement=Make 20 left turns in one run.
screens.main.buttons.modes.sidewinder.name=Sidewinder
screens.main.buttons.modes.sidewinder.description=Sidewinders come at all problems in life from strange angles.
screens.main.buttons.modes.sidewinder.unlock.requirement=Read the credits.
screens.main.buttons.modes.sea.name=Sea snake
screens.main.buttons.modes.sea.description=Sea snakes are really good at holding their breath, but they can't do it indefinitely.
screens.main.buttons.modes.sea.unlock.requirement=Unlock a quarter of the snake levels.
screens.main.buttons.modes.hognose.name=Hognose
screens.main.buttons.modes.hognose.description=Despite it's appearance, Hognose snakes have quite the big mouth.
screens.main.buttons.modes.hognose.unlock.requirement=Die with exactly one point.
screens.main.buttons.modes.mamushi.name=Mamushi
screens.main.buttons.modes.mamushi.description=Mamushis never think things through and have a bad habit of leaving enemies in their wake as a result.
screens.main.buttons.modes.mamushi.unlock.requirement=Eat an odd number of pills in one session.
screens.main.buttons.modes.trouser.name=Trouser
screens.main.buttons.modes.trouser.description=Trouser snakes are only interested in one thing: being the biggest snakes around.
screens.main.buttons.modes.trouser.unlock.requirement=Quit a session midway through.
screens.main.buttons.modes.boa.name=Boa
screens.main.buttons.modes.boa.description=Boa constrictors have attachment issues, often times leading to suffocating those they love.
screens.main.buttons.modes.boa.unlock.requirement=Warp to the other side 200 times.
screens.main.buttons.modes.mamba.name=Mamba
screens.main.buttons.modes.mamba.description=Mambas are a species of snakes that live with their heads in the clouds, and they often can't tell if they're coming or going.
screens.main.buttons.modes.mamba.unlock.requirement=Unlock half of the snake levels.
screens.main.buttons.modes.burmese.name=Burmese
screens.main.buttons.modes.burmese.description=Burmese pythons have bad eyesight - oftentimes, it takes a while for their goals to come in to focus.
screens.main.buttons.modes.burmese.unlock.requirement=Come back a different day.
screens.main.buttons.modes.solid.name=Solid
screens.main.buttons.modes.solid.description=Solid snake is the stealthiest of all snakes, popping out of places you'd never expect him to.
screens.main.buttons.modes.solid.unlock.requirement=Beat a dev high score.
screens.main.buttons.modes.asp.name=Asp
screens.main.buttons.modes.asp.description=Asps are very finicky eaters and consider themselves above eating the seeds of fruit.
screens.main.buttons.modes.asp.unlock.requirement=Get 20 points on Mamushi.
