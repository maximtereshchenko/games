store.upgrade.CLICK_TIER_0.flavor-text="Slightly squeaky."
store.upgrade.CLICK_TIER_1.flavor-text="Click like it's 1,349!"
store.upgrade.CLICK_TIER_2.flavor-text="Heavy, but powerful."
store.upgrade.CLICK_TIER_3.flavor-text="You could cut diamond with these."
store.upgrade.CLICK_TIER_4.flavor-text="These nice mice should suffice."
store.upgrade.CLICK_TIER_5.flavor-text="I rodent do that if I were you."
store.upgrade.CLICK_TIER_6.flavor-text="Clicking is fine and dandy, but don't smash your mouse over it. Get your game on. Go play."
store.upgrade.CLICK_TIER_7.flavor-text="You could be clicking using your touchpad, and we'd be none the wiser."
store.upgrade.CLICK_TIER_8.flavor-text="How much beefier can you make a mouse until it's considered a rat?"
store.upgrade.CLICK_TIER_9.flavor-text="This one takes about 53 people to push it around and another 48 to jump down on the button and trigger a click. You could say it's got some heft to it."
store.upgrade.CLICK_TIER_10.flavor-text="A highly advanced mouse of sophisticated design. Only one thing on its mind: to click."
store.upgrade.CLICK_TIER_11.flavor-text="A shifting blur in the corner of your eye, this mouse can trigger a flurry of clicks when grazed by even the slightest breeze."
store.upgrade.CLICK_TIER_12.flavor-text="Composed of a material that neither science nor philosophy is equipped to conceptualize. And boy, does it ever click."
store.upgrade.CLICK_TIER_13.flavor-text="Made from a substance impossible to manufacture, only obtained through natural happenstance; its properties bewilder even the most precise measuring instruments."
store.upgrade.CLICK_TIER_14.flavor-text="This mouse is, by virtue of the strange elements that make it up, present in every position in space simultaneously, in a manner; this alleviates its owner from the need to move it around, redirecting all such kinetic power to the intensity of its clicks."
store.upgrade.CURSOR_TIER_0.flavor-text="prod prod"
store.upgrade.CURSOR_TIER_1.flavor-text="it... it hurts to click..."
store.upgrade.CURSOR_TIER_2.flavor-text="Look ma, both hands!"
store.upgrade.CURSOR_TIER_3.flavor-text="clickity"
store.upgrade.CURSOR_TIER_4.flavor-text="clickityclickity"
store.upgrade.CURSOR_TIER_5.flavor-text="clickityclickityclickity"
store.upgrade.CURSOR_TIER_6.flavor-text="clickityclickityclickityclickity"
store.upgrade.CURSOR_TIER_7.flavor-text="clickityclickityclickityclickityclick"
store.upgrade.CURSOR_TIER_8.flavor-text="man, just go click click click click click, it’s real easy, man."
store.upgrade.CURSOR_TIER_9.flavor-text="sometimes things just click"
store.upgrade.CURSOR_TIER_10.flavor-text="[cursory flavor text]"
store.upgrade.CURSOR_TIER_11.flavor-text="Turns out you can quite put your finger on it."
store.upgrade.CURSOR_TIER_12.flavor-text="Only for the freakiest handshakes."
store.upgrade.CURSOR_TIER_13.flavor-text="If you still can't quite put your finger on it, you must not be trying very hard."
store.upgrade.CURSOR_TIER_14.flavor-text="Whatever you touch turns to dough in your clutch."
store.upgrade.GRANDMA_TIER_0.flavor-text="RE:RE:thought you'd get a kick out of this ;))"
store.upgrade.GRANDMA_TIER_1.flavor-text="Just what you kneaded."
store.upgrade.GRANDMA_TIER_2.flavor-text="squish"
store.upgrade.GRANDMA_TIER_3.flavor-text="Gets me going."
store.upgrade.GRANDMA_TIER_4.flavor-text="Oh... so THAT's what I've been baking."
store.upgrade.GRANDMA_TIER_5.flavor-text="Counter-intuitively, grandmas have the uncanny ability to become more powerful the older they get."
store.upgrade.GRANDMA_TIER_6.flavor-text="Complete with flame decals and a little horn that goes "toot"."
store.upgrade.GRANDMA_TIER_7.flavor-text="It might be a classic tale of bad parenting, but let's see where grandma is going with this."
store.upgrade.GRANDMA_TIER_8.flavor-text="Extremely unsettling, and somehow even worse than the regular kind."
store.upgrade.GRANDMA_TIER_9.flavor-text="Why do they always have those strange wispy pink dos? What do they know about candy floss that we don't?"
store.upgrade.GRANDMA_TIER_10.flavor-text="Apparently these ladies are much more amiable if you take the time to learn their strange, ancient customs, which seem to involve saying "please" and "thank you" and staring at the sun with bulging eyes while muttering eldritch curses under your breath."
store.upgrade.GRANDMA_TIER_11.flavor-text="Genetic testing shows that most of your grandmas are infected with a strange degenerative disease that only seems to further their powers; the more time passes, the older they get. This should concern you."
store.upgrade.GRANDMA_TIER_12.flavor-text="In an extensive double-blind study (sample size: 12 millions), your researchers have found evidence that grandmas are up to twice as productive if you just come by and say hi once in a while. It's nice to check up on your grans! (Do not under any circumstances ingest any tea or tea-like substances the grandmas may offer you.)."
store.upgrade.GRANDMA_TIER_13.flavor-text="A grandma's kitchen cabinet is a befuddling place. Through lesser-studied aggregating instincts, grandmas will tend to gradually fill all nearby cabinets with various sorts of things, such as curious coconut snacks or dietetic powders. By contract, these are legally yours, which opens up exciting opportunities for your substance investigation department."
store.upgrade.GRANDMA_TIER_14.flavor-text="Perhaps the result of prolonged service, your grandmas have developed all kinds of odd and aggressive hierarchies among themselves; these will help them not hurt each other as bad during their endless turf wars."
store.upgrade.FARM_TIER_0.flavor-text="Rake in the dough!"
store.upgrade.FARM_TIER_1.flavor-text="It's chocolate, I swear."
store.upgrade.FARM_TIER_2.flavor-text="A relative of the breadfruit."
store.upgrade.FARM_TIER_3.flavor-text="All-natural mutations."
store.upgrade.FARM_TIER_4.flavor-text="Staring at your crops with mischievous glee."
store.upgrade.FARM_TIER_5.flavor-text="There's no such thing as over-watering. The moistest is the bestest."
store.upgrade.FARM_TIER_6.flavor-text="A sugary parasite whose tendrils help cookie growth. Please do not breathe in the spores. In case of spore ingestion, seek medical help within the next 36 seconds."
store.upgrade.FARM_TIER_7.flavor-text="Taking care of crops is so much easier when your plants can just walk about and help around the farm. Do not pet. Do not feed. Do not attempt to converse with."
store.upgrade.FARM_TIER_8.flavor-text="Made by people, for people, from people and ready to unleash some righteous scorching pain on those pesky insects that so deserve it."
store.upgrade.FARM_TIER_9.flavor-text="Ah, yes. These help quite a bit. Somehow."
store.upgrade.FARM_TIER_10.flavor-text="You have to import these from far up north, but they really help aerate the soil!"
store.upgrade.FARM_TIER_11.flavor-text="An enormous genetic repository that could outlive an apocalypse. Guarantees the survival of your empire, or at the very least its agricultural components, should civilization fall. Which should be any day now."
store.upgrade.FARM_TIER_12.flavor-text="Plants aren't for eating, plants are for exploitative agriculture and astronomical profit margins!"
store.upgrade.FARM_TIER_13.flavor-text="Grinding surplus cookies into paste that you then spread onto your fields enables a strange feedback loop in the quality of your cookie crops. Cookie feeding on cookie should be an abomination, but then why does it taste so good?"
store.upgrade.FARM_TIER_14.flavor-text="Embarked AI lets your field vehicles sow and harvest cookie crops at any time of the day or night, and with so few human casualties, too!"
store.upgrade.MINE_TIER_0.flavor-text="A pink, volatile gas, found in the depths of some chocolate caves."
store.upgrade.MINE_TIER_1.flavor-text="You're in deep."
store.upgrade.MINE_TIER_2.flavor-text="Finally caved in?"
store.upgrade.MINE_TIER_3.flavor-text="Pierce the heavens, etc."
store.upgrade.MINE_TIER_4.flavor-text="Questionable efficiency, but spectacular nonetheless."
store.upgrade.MINE_TIER_5.flavor-text="You've finally dug a tunnel down to the Earth's core. It's pretty warm down here."
store.upgrade.MINE_TIER_6.flavor-text="These new state-of-the-art excavators have been tested on Merula, Globort and Flwanza VI, among other distant planets which have been curiously quiet lately."
store.upgrade.MINE_TIER_7.flavor-text="A previously untapped resource, canola oil permeates the underground olifers which grant it its particular taste and lucrative properties."
store.upgrade.MINE_TIER_8.flavor-text="Engineered from real human beings within your very labs, these sturdy little folks have a knack for finding the tastiest underground minerals in conditions that more expensive machinery probably wouldn't survive."
store.upgrade.MINE_TIER_9.flavor-text="These aren't used for anything freaky! The miners just enjoy having a pet or two down there."
store.upgrade.MINE_TIER_10.flavor-text="After extracting so much sediment for so long, you've formed some veritable mountains of your own from the accumulated piles of rock and dirt. Time to dig through those and see if you find anything fun!"
store.upgrade.MINE_TIER_11.flavor-text="You've dug your drills through just about every solid surface you could find. But did you know recent advances have revealed untold riches hiding within non-solid surfaces too?"
store.upgrade.MINE_TIER_12.flavor-text="Your geologists have isolated a family of once-overlooked sugary ores that, when combined, may be turned into even more cookie ingredients. Your millions of miles of previously useless tunnels probably house insane amounts of the stuff!"
store.upgrade.MINE_TIER_13.flavor-text="Stratum after stratum, you've extracted strange new minerals heretofore unknown to geology. Ushering a new era of materials research, your scientists have been able to identify every new element your mines have discovered, including whatever those things are in the upgrade tier names."
store.upgrade.MINE_TIER_14.flavor-text="You were rather skeptical about installing such embarrassingly low-tech implements, but limiting the number of daily cave-ins really does help with that annoying employee turnover!"
store.upgrade.FACTORY_TIER_0.flavor-text="You're going places."
store.upgrade.FACTORY_TIER_1.flavor-text="Cheaper, healthier workforce."
store.upgrade.FACTORY_TIER_2.flavor-text="Slackers will be terminated."
store.upgrade.FACTORY_TIER_3.flavor-text="Gives your cookies a healthy glow."
store.upgrade.FACTORY_TIER_4.flavor-text="A major part of cookie recombobulation."
store.upgrade.FACTORY_TIER_5.flavor-text="A patented process increasing cookie yield two-fold for the same amount of ingredients. Don't ask how, don't take pictures, and be sure to wear your protective suit."
store.upgrade.FACTORY_TIER_6.flavor-text="Semi-synthetic organisms don't slack off, don't unionize, and have 20% shorter lunch breaks, making them ideal labor fodder."
store.upgrade.FACTORY_TIER_7.flavor-text="Why didn't we think of this earlier?"
store.upgrade.FACTORY_TIER_8.flavor-text="You figured you might get better productivity if you actually told your workers to learn how to work the machines. Sometimes, it's the little things..."
store.upgrade.FACTORY_TIER_9.flavor-text="Oh, these are lovely! You can now reward your factory employees for good behavior, such as working overtime or snitching on coworkers. 58 brownie points gets you a little picture of a brownie, and 178 of those pictures gets you an actual brownie piece for you to do with as you please! Infantilizing? Maybe. Oodles of fun? You betcha!"
store.upgrade.FACTORY_TIER_10.flavor-text="If you're bad at something, always do it for free."
store.upgrade.FACTORY_TIER_11.flavor-text="Through careful social engineering you've convinced your workers that "union" is a slur that only the most vile and repugnant filth among us would ever dare utter! Sometimes progress isn't in the big machines, it's in the little lies!"
store.upgrade.FACTORY_TIER_12.flavor-text="In this house, I guess we don't care much for the laws of thermodynamics."
store.upgrade.FACTORY_TIER_13.flavor-text="Lines are depressingly 1-dimensional. Beyond assembly lines, we posit the existence of higher-order assembly entities, such as assembly squares, assembly cubes - perhaps even assembly tesseracts. Any deeper than that and we doubt we'll be able to write manuals your workers can read."
store.upgrade.FACTORY_TIER_14.flavor-text="It's simple common sense; the more automation, the less work you have to do! Maybe one day you'll even automate yourself out of your own job. Exciting!"
store.upgrade.BANK_TIER_0.flavor-text="Able to process a higher amount of transactions. Careful though, as taller tellers tell tall tales."
store.upgrade.BANK_TIER_1.flavor-text="For those truly valued customers."
store.upgrade.BANK_TIER_2.flavor-text="You know what they say : better safe than sorry."
store.upgrade.BANK_TIER_3.flavor-text="This revolutionary currency is much easier to melt from and into ingots - and tastes much better, for a change."
store.upgrade.BANK_TIER_4.flavor-text="Can't argue with mathematics! Now fork it over."
store.upgrade.BANK_TIER_5.flavor-text="The ultimate grail of economic thought; the feng shui of big money, the stock market yoga - the Heimlich maneuver of dimes and nickels."
store.upgrade.BANK_TIER_6.flavor-text="This new monetary school of thought is all the rage on the banking scene; follow its precepts and you may just profit from it."
store.upgrade.BANK_TIER_7.flavor-text="If not now, when? If not it, what? If not things... stuff?"
store.upgrade.BANK_TIER_8.flavor-text="It's really quite simple; you make all currency too delicious not to eat, solving world hunger and inflation in one fell swoop!"
store.upgrade.BANK_TIER_9.flavor-text="We let the public think these are complicated financial terms when really we're just rewarding the bankers with snazzy bicycles for a job well done. It's only natural after you built those fancy gold swimming pools for them, where they can take a dip and catch Kondratiev waves."
store.upgrade.BANK_TIER_10.flavor-text="Rule 387 : a cookie baked is a cookie kept."
store.upgrade.BANK_TIER_11.flavor-text="You control so many branches of the global economy and legislative bodies that, through a particularly creative loophole, donating money (to yourself) grants you even more cash in tax deductions than you started with!"
store.upgrade.BANK_TIER_12.flavor-text="Wow, they're tiny! Wish you'd thought of that sooner!"
store.upgrade.BANK_TIER_13.flavor-text="A loyalty program wherein each purchase of your cookies comes with free Cookie Points, which can in turn be redeemed for more cookies, thus creating the self-sustaining economy you've been looking for."
store.upgrade.BANK_TIER_14.flavor-text="You're not quite sure what this entails, but it must have been quite the cake for folks to lose their homes over it."
